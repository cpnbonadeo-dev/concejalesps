<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fichas PS Castellanos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#f0f4fb;color:#1a2236}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#c62828 0%,#e63946 40%,#1a237e 100%);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-screen.hidden{display:none}
.login-box{background:#fff;border-radius:16px;padding:30px 24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.login-box h2{color:#1a237e;font-size:19px;font-weight:800;margin-bottom:3px}
.login-sub{color:#888;font-size:12px;margin-bottom:22px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:3px;margin-top:14px}
.linp{width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid #dde3f0;background:#f8faff;color:#1a2236;font-size:14px}
.linp:focus{outline:2px solid #e63946;border-color:transparent;background:#fff}
.lerr{color:#e63946;font-size:12px;margin-top:8px;min-height:16px}
.lbtn{width:100%;margin-top:16px;padding:12px;background:#e63946;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(230,57,70,.3)}
.lbtn:hover{background:#c62828}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}

/* ── HEADER ── */
.hdr{background:linear-gradient(90deg,#c62828,#e63946);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(198,40,40,.25)}
.hdr-left h1{color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.hdr-left .hsub{color:#ffcdd2;font-size:10px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{background:rgba(0,0,0,.2);border-radius:16px;padding:3px 10px 3px 6px;display:flex;align-items:center;gap:6px}
.hdr-av{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.hdr-nm{font-size:11px;color:#fff;font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-out{font-size:10px;color:#ffcdd2;background:none;border:none;cursor:pointer;text-decoration:underline}

/* ── PROGRESS ── */
.progress-bar{background:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #e8edf6}
.prog-txt{font-size:12px;color:#7a8aaa;font-weight:700}
.prog-track{flex:1;height:5px;background:#e8edf6;border-radius:3px;margin:0 10px}
.prog-fill{height:100%;background:linear-gradient(90deg,#e63946,#ff6b6b);border-radius:3px;transition:width .3s}
.prog-filter{font-size:11px;color:#e63946;cursor:pointer;background:none;border:none;text-decoration:underline;font-weight:600}

/* ── CARD AREA ── */
.card-area{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:#f0f4fb}

/* ── CARD ── */
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(26,34,54,.08);border:1px solid #e8edf6}

.card-top{background:linear-gradient(135deg,#1a237e 0%,#283593 60%,#1e3a5f 100%);padding:14px 14px 12px;border-bottom:none}
.card-nombre{font-size:22px;font-weight:900;color:#fff;line-height:1.1}
.card-tipo{font-size:10px;color:#90caf9;margin-top:1px;font-weight:600;letter-spacing:.3px}
.card-tier-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.tier{font-size:10px;font-weight:800;letter-spacing:.7px;padding:3px 9px;border-radius:6px}
.t-territorio{background:rgba(255,255,255,.2);color:#ffcdd2;border:1px solid rgba(255,255,255,.3)}
.t-presencia{background:rgba(255,235,59,.15);color:#fff176;border:1px solid rgba(255,235,59,.3)}
.t-potencial{background:rgba(144,202,249,.15);color:#90caf9;border:1px solid rgba(144,202,249,.3)}
.t-vincular{background:rgba(255,255,255,.08);color:#b0bec5;border:1px solid rgba(255,255,255,.15)}
.card-gov{font-size:11px;color:#90caf9;flex:1;line-height:1.3;font-weight:500}

/* TOP BUTTON */
.vnc-add-btn-top{flex-shrink:0;padding:6px 12px;border:1.5px solid rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;backdrop-filter:blur(4px)}
.vnc-add-btn-top:hover{border-color:#fff;background:rgba(255,255,255,.25)}

/* SECCIONES INTERNAS */
.csec{padding:11px 14px;border-bottom:1px solid #f0f4fb}
.csec:last-child{border-bottom:none}
.csec-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#7a8aaa;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.afil-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.afil-item{font-size:11px;color:#5a6a8a;padding:1px 0;line-height:1.4}
.afil-toggle{background:none;border:1.5px solid #dde3f0;border-radius:10px;color:#3b5bdb;font-size:10px;font-weight:700;padding:2px 8px;cursor:pointer;margin-top:4px;display:inline-block}
.afil-toggle:hover{border-color:#3b5bdb;background:#f0f4ff}
.afil-count-badge{display:inline-block;background:#e8f0ff;color:#3b5bdb;font-size:10px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:4px}

.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:#f8faff;border-radius:8px;padding:8px 10px;flex:1;min-width:90px;border:1px solid #e8edf6}
.kpi-val{font-size:18px;font-weight:800;color:#1a2236}
.kpi-lbl{font-size:10px;color:#7a8aaa;margin-top:1px}
.kpi-red .kpi-val{color:#e63946}
.kpi-green .kpi-val{color:#2e7d32}
.kpi-blue .kpi-val{color:#1565c0}

.info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f4fb;font-size:12px}
.info-row:last-child{border-bottom:none}
.info-lbl{color:#7a8aaa;font-size:11px}
.info-val{color:#1a2236;font-weight:600;text-align:right;max-width:60%}
.val-fuerte{color:#2e7d32}
.val-debil{color:#e65100}
.val-nula{color:#c62828}

/* VÍNCULOS MINI */
.vnc-mini{background:#f8faff;border-radius:8px;padding:8px 10px;margin-bottom:5px;border-left:3px solid #3b5bdb;font-size:12px}
.vnc-mini.persona{border-left-color:#e63946}
.vnc-mini-nombre{font-weight:700;color:#1a2236}
.vnc-mini-tipo{font-size:10px;color:#7a8aaa}
.vnc-mini-op{color:#2e7d32;font-size:11px;margin-top:2px}
.vnc-mini-meta{font-size:10px;color:#aab;margin-top:3px}
.no-vnc{color:#bcc;font-size:12px;font-style:italic}

/* EVALUACIONES */
.eval-resumen{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.eval-chip{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:700}
.ec-actuar{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.ec-intentar{background:#fff8e1;color:#e65100;border:1px solid #ffcc80}
.ec-no{background:#fce4ec;color:#c62828;border:1px solid #f48fb1}
.ec-no_se{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}

/* EVAL BOTTOM */
.eval-fixed{background:#fff;border-top:1px solid #e8edf6;padding:10px 14px;flex-shrink:0;box-shadow:0 -2px 8px rgba(26,34,54,.06)}
.eval-fixed>span{display:block;font-size:11px;font-weight:700;color:#7a8aaa;margin-bottom:8px;text-align:center}
.eval-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.eval-btn{padding:10px 8px;border-radius:10px;border:1.5px solid #e8edf6;background:#f8faff;font-size:12px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3;color:#1a2236;transition:all .15s}
.eval-btn:hover,.eval-btn.sel{border-color:transparent;transform:scale(.98)}
.sel-actuar{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}
.sel-intentar{background:#fff8e1;border-color:#ffcc80;color:#e65100}
.sel-no{background:#fce4ec;border-color:#f48fb1;color:#c62828}
.sel-no_se{background:#e3f2fd;border-color:#90caf9;color:#1565c0}

/* NAV */
.nav{display:flex;justify-content:space-between;padding:8px 14px;background:#fff;border-top:1px solid #e8edf6;flex-shrink:0}
.nav-btn{background:none;border:1.5px solid #e8edf6;color:#7a8aaa;border-radius:10px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer}
.nav-btn:hover:not(:disabled){border-color:#e63946;color:#e63946;background:#fff8f8}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-pos{font-size:13px;color:#1a2236;font-weight:700;align-self:center}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(26,34,54,.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:0 0 24px;max-height:88vh;overflow-y:auto}
.modal-title{padding:16px 20px 0;font-size:15px;font-weight:800;color:#1a2236}
.modal-loc{padding:4px 20px 12px;font-size:12px;color:#7a8aaa;font-weight:600;border-bottom:1px solid #f0f4fb}
.mrow{padding:8px 20px 0}
.mrow label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#7a8aaa;margin-bottom:4px}
.mrow input,.mrow select,.mrow textarea{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #dde3f0;background:#f8faff;color:#1a2236;font-size:13px;font-family:inherit}
.mrow input:focus,.mrow select:focus,.mrow textarea:focus{outline:none;border-color:#e63946;background:#fff}
.mrow textarea{min-height:70px;resize:vertical}
.req{color:#e63946}
.merr{padding:4px 20px 0;color:#e63946;font-size:12px;min-height:16px}
.mbtn{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:13px;background:#e63946;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(230,57,70,.25)}
.mbtn:hover{background:#c62828}
.mbtn:disabled{background:#ccc;box-shadow:none}

/* TOAST */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#1a2236;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:500;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#c62828}

/* FLASH */
@keyframes flash{0%,100%{opacity:1}50%{opacity:.6}}
.flash{animation:flash .5s ease}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>📋 Fichas PS Castellanos</h2>
    <div class="login-sub">Identificate para poder registrar aportes</div>
    <label class="lbl">Nombre y apellido</label>
    <input class="linp" type="text" id="lNombre" placeholder="Nombre Apellido" autocomplete="name"
      onkeydown="if(event.key==='Enter')document.getElementById('lDni').focus()">
    <label class="lbl">DNI</label>
    <input class="linp" type="text" id="lDni" placeholder="12345678" inputmode="numeric"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="lerr" id="lErr"></div>
    <button class="lbtn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="appDiv" style="display:none">

  <div class="hdr">
    <div class="hdr-left">
      <h1>📋 Fichas territoriales</h1>
      <div class="hsub">PS Departamento Castellanos</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-user">
        <div class="hdr-av" id="hdrAv">?</div>
        <div class="hdr-nm" id="hdrNm"></div>
        <button class="hdr-out" onclick="logout()">salir</button>
      </div>
    </div>
  </div>

  <div class="progress-bar">
    <span class="prog-txt" id="progTxt">1 / 46</span>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:2%"></div></div>
    <button class="prog-filter" onclick="toggleFiltros()">Filtrar ▾</button>
  </div>

  <!-- Filtros colapsables -->
  <div id="filtrosDiv" style="display:none;background:#13182a;padding:8px 12px;border-bottom:1px solid #1e2d45;display:none">
    <select id="filtTier" onchange="aplicarFiltro()" style="width:100%;padding:7px 10px;border-radius:6px;border:1px solid #2a3a5a;background:#16213e;color:#e0e0e0;font-size:12px">
      <option value="">Todos los niveles</option>
      <option value="territorio">🔴 Territorio</option>
      <option value="presencia">🟡 Presencia</option>
      <option value="potencial">🔵 Potencial</option>
      <option value="vincular">⚪ Vincular</option>
    </select>
  </div>

  <div class="card-area" id="cardArea">
    <div style="text-align:center;padding:40px;color:#334">Cargando...</div>
  </div>

  <!-- EVALUACIÓN FIJA: siempre visible, fuera del scroll -->
  <div class="eval-fixed" id="evalFixed">
    <div class="eval-pregunta">
      <span>¿Cuál es tu mirada sobre esta localidad?</span>
      <span id="evalMiLabel" style="color:#e63946;font-size:10px"></span>
    </div>
    <div class="eval-btns" id="evalBtnsEl"></div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="btnPrev" onclick="irA(curIdx-1)" disabled>← Anterior</button>
    <span class="nav-pos" id="navPos">1 / 46</span>
    <button class="nav-btn" id="btnNext" onclick="irA(curIdx+1)">Siguiente →</button>
  </div>

</div>

<!-- MODAL ¿OTRO VÍNCULO? -->
<div class="modal-bg" id="otroBg" style="display:none" onclick="if(event.target===this)noMasVinculo()">
  <div class="modal" style="padding:24px 20px;text-align:center;max-width:300px">
    <div style="font-size:22px;margin-bottom:8px">✅</div>
    <div style="font-size:13px;color:#ccd;margin-bottom:4px">¡Vínculo guardado!</div>
    <div style="font-size:12px;color:#889;margin-bottom:18px">¿Querés agregar otro en <b id="otroLocN" style="color:#60a5fa"></b>?</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="otroVinculo()" style="padding:8px 18px;background:rgba(96,165,250,.15);border:1px solid #60a5fa;border-radius:16px;color:#60a5fa;font-size:12px;font-weight:700;cursor:pointer">➕ Otro vínculo</button>
      <button onclick="noMasVinculo()" style="padding:8px 18px;background:rgba(255,255,255,.05);border:1px solid #2a3a5a;border-radius:16px;color:#889;font-size:12px;font-weight:700;cursor:pointer">Siguiente →</button>
    </div>
  </div>
</div>

<!-- MODAL VÍNCULO -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-title">🔗 Registrar contacto u oportunidad</div>
    <div class="modal-loc" id="mLoc">—</div>
    <input type="hidden" id="mLocId">
    <div class="mrow">
      <label>Nombre <span class="req">*</span></label>
      <input type="text" id="mNombre" placeholder="Persona, club, institución...">
    </div>
    <div class="mrow">
      <label>Tipo</label>
      <select id="mTipo">
        <option value="persona">👤 Persona</option>
        <option value="institucion">🏛 Institución</option>
        <option value="club">🏟 Club u organización social</option>
        <option value="escuela">🎓 Escuela o cooperadora</option>
        <option value="iglesia">⛪ Iglesia u organización comunitaria</option>
        <option value="comercio">🏪 Comercio o actividad productiva</option>
        <option value="cultural">🎭 Espacio cultural o deportivo</option>
        <option value="otro">📌 Otro</option>
      </select>
    </div>
    <div class="mrow">
      <label>¿Cómo me vinculo / cómo puedo acercarme? <span class="req">*</span></label>
      <textarea id="mVinculo" placeholder="Ej: Lo conozco del club, es familiar..."></textarea>
    </div>
    <div class="mrow">
      <label>¿Qué oportunidad veo?</label>
      <textarea id="mOportunidad" placeholder="Ej: Podría organizar una reunión, tiene llegada a..."></textarea>
    </div>

    <div class="mrow">
      <label>Observaciones</label>
      <textarea id="mObs" placeholder="Cualquier detalle adicional..."></textarea>
    </div>
    <div class="merr" id="mErr"></div>
    <div class="macts">
      <button class="mbtn mbtn-red" id="mBtn" onclick="guardarVinculo()">💾 Guardar</button>
      <button class="mbtn mbtn-gray" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function getTier(b){
  if(b.psEjec) return 'territorio';
  if(b.centroPS||b.congresal) return 'presencia';
  if(b.pres==='fuerte'||b.pres==='debil') return 'potencial';
  return 'vincular';
}

// ── ESTADO ─────────────────────────────────────────────────────
let sess = JSON.parse(localStorage.getItem(LS_SESS)||"null");
let DATOS={}, VNCS={}, EVALS={};
let lista=[], curIdx=0;

// ── LOGIN ──────────────────────────────────────────────────────
function doLogin(){
  const nombre=document.getElementById('lNombre').value.trim();
  const dni=document.getElementById('lDni').value.trim().replace(/\D/g,'');
  const err=document.getElementById('lErr');
  if(!nombre){err.textContent='Escribí tu nombre.';return;}
  if(!dni||dni.length<6){err.textContent='Ingresá tu DNI.';return;}
  sess={nombre,dni};
  localStorage.setItem(LS_SESS,JSON.stringify(sess));
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appDiv').style.display='flex';
  document.getElementById('hdrAv').textContent=nombre[0].toUpperCase();
  document.getElementById('hdrNm').textContent=nombre;
  loadAll();
}
function logout(){
  localStorage.removeItem(LS_SESS); sess=null;
  document.getElementById('appDiv').style.display='none';
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('lNombre').value='';
  document.getElementById('lDni').value='';
}

// ── CARGA DATOS ────────────────────────────────────────────────
async function loadAll(){
  const [datos,vncs,evals]=await Promise.all([
    supa('datos?select=id,presencia,ref,tel,centro'),
    supa('vinculos?order=created_at.desc&limit=2000&select=vid,localidad,nombre,tipo,vinculo,oportunidad,accion,autor,created_at'),
    supa('evaluaciones?select=localidad_id,evaluacion,autor&limit=5000')
  ]);
  if(datos) datos.forEach(d=>{DATOS[d.id]=d;});
  if(vncs)  vncs.forEach(v=>{if(!VNCS[v.localidad])VNCS[v.localidad]=[];VNCS[v.localidad].push(v);});
  if(evals) evals.forEach(e=>{if(!EVALS[e.localidad_id])EVALS[e.localidad_id]=[];EVALS[e.localidad_id].push(e);});
  aplicarFiltro();
}

// ── FILTROS ────────────────────────────────────────────────────
function toggleFiltros(){
  const d=document.getElementById('filtrosDiv');
  d.style.display=d.style.display==='none'?'block':'none';
}
function aplicarFiltro(){
  const tf=document.getElementById('filtTier')?.value||'';
  lista=BASE.filter(b=>!tf||getTier(b)===tf);
  curIdx=0;
  renderCard();
}

// ── RENDER ─────────────────────────────────────────────────────
function irA(idx){
  if(idx<0||idx>=lista.length)return;
  curIdx=idx;
  renderCard();
  document.getElementById('cardArea').scrollTop=0;
}

function renderCard(){
  const total=lista.length;
  const b=lista[curIdx];
  if(!b){document.getElementById('cardArea').innerHTML='<div style="text-align:center;padding:40px;color:#334">Sin localidades</div>';return;}

  const tier=getTier(b);
  const d=DATOS[b.id]||{};
  const pres=d.presencia||b.pres;
  const ref=d.ref||b.psref;
  const centro=d.centro==='si'||b.centroPS;
  const vncs=VNCS[b.id]||[];
  const evs=EVALS[b.id]||[];

  // Conteo evaluaciones
  const cnt={actuar:0,intentar:0,no:0,no_se:0};
  evs.forEach(e=>{if(cnt[e.evaluacion]!==undefined)cnt[e.evaluacion]++;});
  const totalEvs=cnt.actuar+cnt.intentar+cnt.no;
  const miEval=evs.find(e=>e.autor===sess?.nombre);

  // Progress
  const pos=curIdx+1;
  document.getElementById('progTxt').textContent=pos+' / '+total;
  document.getElementById('navPos').textContent=pos+' / '+total;
  document.getElementById('progFill').style.width=(pos/total*100).toFixed(1)+'%';
  document.getElementById('btnPrev').disabled=curIdx===0;
  document.getElementById('btnNext').disabled=curIdx===lista.length-1;

  // Evaluación buttons → se renderizan en el div fijo fuera del scroll
  const evalBtnsHtml=EVAL_DEF.map(v=>`
    <button class="eval-btn ${miEval?.evaluacion===v.k?v.cls:''}" onclick="evaluar('${b.id}','${b.n}','${v.k}')">
      <div style="font-size:16px;margin-bottom:2px">${v.ico}</div>
      <div>${v.txt}</div>
    </button>`).join('');
  document.getElementById('evalBtnsEl').innerHTML = evalBtnsHtml;
  document.getElementById('evalMiLabel').textContent = miEval
    ? (EVAL_MAP[miEval.evaluacion]?.ico + ' Tu voto') : '';

  // Vínculos
  const vncsHtml=vncs.length
    ?vncs.slice(0,3).map(v=>`
      <div class="vnc-mini ${v.tipo==='persona'?'persona':''}">
        <div class="vnc-mini-tipo">${TIPO_LBL[v.tipo]||v.tipo}</div>
        <div class="vnc-mini-nombre">${esc(v.nombre)}</div>
        ${v.oportunidad?`<div class="vnc-mini-op">💡 ${esc(v.oportunidad)}</div>`:''}
        <div class="vnc-mini-meta">🙋 ${esc(v.autor||'—')} · ${fmtF(v.created_at)}</div>
      </div>`).join('')+(vncs.length>3?`<div style="color:#334;font-size:11px;padding:3px 0">...y ${vncs.length-3} más</div>`:'')
    :'<div class="no-vnc">Sin vínculos registrados</div>';

  // Resumen evaluaciones
  const evalResumen=totalEvs?`
    <div class="eval-resumen">
      ${cnt.actuar?`<span class="eval-chip ec-actuar">✅ ${cnt.actuar} van</span>`:''}
      ${cnt.intentar?`<span class="eval-chip ec-intentar">🔄 ${cnt.intentar} intentar</span>`:''}
      ${cnt.no?`<span class="eval-chip ec-no">🚫 ${cnt.no} no</span>`:''}
      ${cnt.no_se?`<span class="eval-chip ec-no_se">🤷 ${cnt.no_se} no sé</span>`:''}
    </div>`:'';
  const miEvalTxt=miEval?`<div class="mi-eval">Tu evaluación: <strong>${EVAL_MAP[miEval.evaluacion]?.ico} ${EVAL_MAP[miEval.evaluacion]?.txt}</strong></div>`:'';

  document.getElementById('cardArea').innerHTML=`
  <div class="card">
    <div class="card-top">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div>
          <div class="card-nombre">${esc(b.n)}</div>
          <div class="card-tipo">${b.G?'Municipio':'Comuna'}</div>
        </div>
        <button class="vnc-add-btn-top" onclick="abrirModal('${b.id}','${esc(b.n)}')">+ Sumar info</button>
      </div>
      <div class="card-tier-row">
        <span class="tier t-${tier}">${TIER_LBL[tier]}</span>
        <span class="card-gov">${esc(b.px)}</span>
      </div>
    </div>

    <div class="csec">
      <div class="csec-title">📊 Electoral 2025</div>
      <div class="kpis">
        ${b.hab?`<div class="kpi kpi-blue"><div class="kpi-val">${fmt(b.hab)}</div><div class="kpi-lbl">Hab. Censo '22</div></div>`:''}
        <div class="kpi"><div class="kpi-val">${fmt(b.el)}</div><div class="kpi-lbl">Electores</div></div>
        <div class="kpi"><div class="kpi-val">${pct(b.vg1,b.vg)}</div><div class="kpi-lbl">UNIDOS 1°</div></div>
        ${b.p2&&b.v2?`<div class="kpi"><div class="kpi-val" style="font-size:13px">${pct(b.v2,b.vg)}</div><div class="kpi-lbl">${esc(b.p2)} 2°</div></div>`:''}
      </div>
      ${b.hab?`<div style="font-size:9px;color:#334;margin-top:5px">Fuente pob.: <a href="https://censo.gob.ar/index.php/datos_definitivos/" target="_blank" style="color:#445;text-decoration:underline">INDEC Censo 2022</a></div>`:''}
    </div>

    <div class="csec">
      <div class="csec-title">🔴 Partido Socialista</div>
      <div class="info-row"><span class="info-lbl">Presencia</span><span class="info-val val-${pres}">${PRES_LBL[pres]||'—'}</span></div>
      <div class="info-row"><span class="info-lbl">Referente/a</span><span class="info-val" style="color:#60a5fa">${ref?esc(ref):'—'}</span></div>
      <div class="info-row"><span class="info-lbl">Centro Socialista</span><span class="info-val" style="${centro?'color:#4caf50':'color:#334'}">${centro?'✅ Sí':'—'}</span></div>
      ${b.sc?`<div class="info-row" style="flex-direction:column;gap:3px"><span class="info-lbl">Notas</span><span style="font-size:11px;color:#aaa;margin-top:2px;line-height:1.5">${esc(b.sc)}</span></div>`:''}
    </div>

    <div class="csec">
      <div class="csec-title">🔗 Vínculos registrados (${vncs.length})</div>
      ${vncsHtml}
    </div>

    ${(()=>{
      const afils=AFIL_NAMES[b.id];
      if(!afils||afils.length===0) return '';
      const toggleId='afil-'+b.id;
      const listHtml=afils.map(n=>`<div class="afil-item">${esc(n)}</div>`).join('');
      return `<div class="csec">
        <div class="csec-title">👥 Afiliados/as<span class="afil-count-badge">${afils.length}</span></div>
        <div id="${toggleId}" class="afil-list" style="display:none">${listHtml}</div>
        <button class="afil-toggle" onclick="(function(btn){var el=document.getElementById('${toggleId}');var open=el.style.display!=='none';el.style.display=open?'none':'block';btn.textContent=open?'Ver lista ▼':'Ocultar ▲'})(this)">Ver lista ▼</button>
      </div>`;
    })()}
    ${evalResumen||miEvalTxt?`<div class="csec">${evalResumen}${miEvalTxt}</div>`:''}
  </div>`;
}

// ── EVALUACIÓN ─────────────────────────────────────────────────
async function evaluar(locId, locN, tipo){
  if(!sess){showToast('Iniciá sesión primero',true);return;}
  // Optimistic update local
  if(!EVALS[locId])EVALS[locId]=[];
  const idx=EVALS[locId].findIndex(e=>e.autor===sess.nombre);
  const entry={localidad_id:locId,evaluacion:tipo,autor:sess.nombre};
  if(idx>=0) EVALS[locId][idx]=entry; else EVALS[locId].push(entry);
  renderCard();

  // Flash visual de confirmación
  const card=document.querySelector('.card');
  if(card){card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),500);}

  // Toast con el nombre de la localidad
  const def=EVAL_MAP[tipo];
  showToast(def.ico+' '+locN+': '+def.txt);

  // Si no tiene conocimiento → avanza directo. Si tiene opinión → abre formulario para sumar info.
  if(tipo === 'no_se'){
    if(curIdx < lista.length-1){ setTimeout(()=>irA(curIdx+1), 900); }
  } else {
    setTimeout(()=>abrirModal(locId, locN), 700);
  }

  // Guardar en Supabase (upsert: si ya existe para este dni+localidad, actualiza)
  supa('evaluaciones',{
    method:'POST',
    body:JSON.stringify({localidad_id:locId,localidad_n:locN,evaluacion:tipo,autor:sess.nombre,autor_dni:sess.dni}),
    prefer:'return=minimal,resolution=merge-duplicates'
  }).then(res=>{
    if(res===null) showToast('⚠️ No se pudo guardar',true);
  });
}

// ── MODAL VÍNCULO ──────────────────────────────────────────────
function abrirModal(locId,locN){
  document.getElementById('mLocId').value=locId;
  document.getElementById('mLoc').textContent='📍 '+locN;
  ['mNombre','mVinculo','mOportunidad','mObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mTipo').value='persona';
  document.getElementById('mErr').textContent='';
  document.getElementById('mBtn').disabled=false;
  document.getElementById('mBtn').textContent='💾 Guardar';
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>document.getElementById('mNombre').focus(),80);
}
function cerrarModal(){
  document.getElementById('modalBg').classList.remove('open');
}

async function guardarVinculo(){
  const locId=document.getElementById('mLocId').value;
  const locN=document.getElementById('mLoc').textContent.replace('📍 ','');
  const nombre=document.getElementById('mNombre').value.trim();
  const vinculo=document.getElementById('mVinculo').value.trim();
  const err=document.getElementById('mErr');
  const btn=document.getElementById('mBtn');
  if(!nombre){err.textContent='El nombre es obligatorio.';return;}
  if(!vinculo){err.textContent='Completá cómo te vinculás.';return;}
  err.textContent=''; btn.disabled=true; btn.textContent='Guardando...';
  const payload={
    autor:sess?.nombre||'anónimo', autor_id:sess?.dni||'',
    localidad:locId, localidad_n:locN, nombre,
    tipo:document.getElementById('mTipo').value,
    vinculo,
    oportunidad:document.getElementById('mOportunidad').value.trim()||null,
    obs:document.getElementById('mObs').value.trim()||null,
    estado:'activo'
  };
  const res=await supa('vinculos',{method:'POST',body:JSON.stringify(payload),prefer:'return=representation'});
  btn.disabled=false; btn.textContent='💾 Guardar';
  if(res!==null){
    if(!VNCS[locId])VNCS[locId]=[];
    VNCS[locId].unshift(res[0]||payload);
    cerrarModal(); renderCard();
    // Preguntar si quiere agregar otro vínculo en la misma localidad
    document.getElementById('otroLocN').textContent = locN;
    document.getElementById('otroBg').style.display = 'flex';
    window._otroLocId = locId; window._otroLocN = locN;
  } else {
    err.textContent='No se pudo guardar. Intentá de nuevo.';
  }
}

// ── OTRO VÍNCULO ───────────────────────────────────────────────
function otroVinculo(){
  document.getElementById('otroBg').style.display='none';
  abrirModal(window._otroLocId, window._otroLocN);
}
function noMasVinculo(){
  document.getElementById('otroBg').style.display='none';
  if(curIdx < lista.length-1){ irA(curIdx+1); }
}

// ── UTILS ──────────────────────────────────────────────────────
function showToast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(isErr?' err':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Swipe soporte móvil
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>60&&!document.getElementById('modalBg').classList.contains('open')){
    if(dx<0) irA(curIdx+1); else irA(curIdx-1);
  }
},{passive:true});

// ── INIT ───────────────────────────────────────────────────────
if(sess){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appDiv').style.display='flex';
  document.getElementById('hdrAv').textContent=sess.nombre[0].toUpperCase();
  document.getElementById('hdrNm').textContent=sess.nombre;
  loadAll();
}
</script>
